[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resourcelib"
version = "0.2.0"
description = "Faceted-tag catalogue for research-field landscapes — papers, tools, labs, datasets, events, money moves, all in one filterable page."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Liudeng Zhang" }]
keywords = ["catalog", "landscape", "literature", "mkdocs", "papermap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
resourcelib = "resourcelib.cli:main"

[project.urls]
Homepage = "https://github.com/Light-Kit/resourcelib"
Issues = "https://github.com/Light-Kit/resourcelib/issues"

[tool.hatch.build.targets.wheel]
packages = ["resourcelib"]
